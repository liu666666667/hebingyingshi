name: 探测并排除假搜索采集站

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 探测假搜索站
        run: python scripts/probe_search.py

      - name: 提交规则与报告
        run: |
          git config --global user.name "hb-bot"
          git config --global user.email "hb-bot@users.noreply.github.com"
          git add config/rules.json config/fake_search_report.json
          if git diff --cached --quiet; then echo "无变更"; else git commit -m "排除假搜索采集站(搜关键词返回全部)"; git push origin main; fi

      - name: 触发主流程重算
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}'
