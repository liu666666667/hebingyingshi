name: 每日影视汇总更新

on:
  schedule:
    # 每天北京时间 20:00 (UTC 12:00)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行汇总流水线（先全网发现，再汇总；发现内化自 yingshi）
        env:
          DISC_TIME_BUDGET: '1500'
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: python scripts/main.py --run-discover --repo "${{ github.repository }}"

      - name: 提交产出与状态回 main
        run: |
          git config --global user.name "hb-bot"
          git config --global user.email "hb-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "每日汇总 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi
